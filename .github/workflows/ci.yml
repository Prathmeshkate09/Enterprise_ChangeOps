name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.15"
          enable-cache: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: python scripts/tasks.py setup

      - name: Lint and type-check
        run: python scripts/tasks.py lint

      - name: Run tests
        run: python scripts/tasks.py test

      - name: Audit locked dependencies
        run: python scripts/tasks.py audit

      - name: Build applications
        run: python scripts/tasks.py build

      - name: Validate Compose model
        run: docker compose config --quiet

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build control API image
        run: docker build --file services/control-api/Dockerfile --tag changeops-control-api:ci .

      - name: Build Control Tower image
        run: docker build --file apps/control-tower/Dockerfile --tag changeops-control-tower:ci .
