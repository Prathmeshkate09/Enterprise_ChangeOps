[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[project]
name = "changeops-tool-gateway"
version = "0.1.0"
description = "Authenticated policy and approval boundary for Enterprise ChangeOps tool execution"
requires-python = ">=3.12,<3.14"
dependencies = [
    "changeops-contracts",
    "changeops-core",
    "changeops-persistence",
    "changeops-policy-engine",
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28.1,<0.29",
    "uvicorn>=0.35.0,<0.36",
]

[tool.uv.sources]
changeops-contracts = { workspace = true }
changeops-core = { workspace = true }
changeops-persistence = { workspace = true }
changeops-policy-engine = { workspace = true }
