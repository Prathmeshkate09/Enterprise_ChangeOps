[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[project]
name = "changeops-core"
version = "0.1.0"
description = "Shared runtime configuration and observability for Enterprise ChangeOps"
requires-python = ">=3.12,<3.14"
dependencies = [
    "changeops-contracts",
    "changeops-persistence",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.10.1,<3",
    "structlog>=25.4.0,<26",
]

[tool.uv.sources]
changeops-contracts = { workspace = true }
changeops-persistence = { workspace = true }
