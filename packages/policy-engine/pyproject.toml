[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[project]
name = "changeops-policy-engine"
version = "0.1.0"
description = "Deterministic RBAC, ABAC, risk, and exact-plan approval policy for Enterprise ChangeOps"
requires-python = ">=3.12,<3.14"
dependencies = [
    "changeops-contracts",
    "pydantic>=2.11.7,<3",
]

[tool.uv.sources]
changeops-contracts = { workspace = true }
